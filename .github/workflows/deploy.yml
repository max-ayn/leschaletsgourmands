name: Déploiement o2switch

on:
  push:
    branches: [main]
  workflow_dispatch: # bouton « Run workflow » pour relancer à la main

concurrency: deploy # jamais deux déploiements en même temps

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24 # Astro 7 exige Node ≥ 22.23
          cache: npm

      - run: npm ci
      - run: npm run build

      # lftp gère la réutilisation de session TLS exigée par le FTPS d'o2switch
      # (l'action SamKirkland échouait en « ECONNRESET (data socket) »).
      - name: Envoi FTPS vers o2switch
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # ponytail: pas de --delete (ne touche jamais à .well-known/ de l'AutoSSL ni au reste du dossier) ;
          # les anciens fichiers de _astro/ restent sur le serveur, sans effet sur le site.
          lftp -u "$FTP_USERNAME" --env-password "$FTP_SERVER" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set net:timeout 30;
            set net:max-retries 2;
            mirror --reverse --verbose --parallel=4 dist/ ./;
            bye
          "
